<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galileo Moons and Craft</title>
<meta name="description" content="Prototype 3D view of the Jovian moons, the Galileo orbiter and the descent probe, drawn from NASA PDS data; every element is labelled as data or illustrative.">
<style>
:root{--inf:#4fd8c4;--bg:#06080e;--panel:#0d1119;--line:#232a3a;--txt:#e4e8f2;--mut:#8f99b3;--acc:#ffb347;--blue:#5cc8ff;--warn:#ff8c69;--ok:#7ee0a5;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 var(--font);overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 360px;height:100%;width:100%;max-width:100vw;overflow:hidden}
header,#stage,aside,footer{min-width:0}
header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:14px;margin:0 8px 0 0;font-weight:600;letter-spacing:.2px}
header h1 span{color:var(--mut);font-weight:400}
select,button{font:12px var(--font);color:var(--txt);background:#141a26;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
button[aria-pressed=true]{background:#2a3350;border-color:#4a5a8a}
button.sm{padding:2px 7px;font-size:11.5px}
label.k{color:var(--mut);font-size:11.5px}
#perf{font:11.5px var(--mono);color:var(--mut);margin-left:auto;white-space:nowrap}
#perf b{color:var(--txt);font-weight:500}
#stage{position:relative;overflow:hidden;background:var(--bg);min-height:0}
#gl,#lead{position:absolute;inset:0;width:100%;height:100%}
#lead{pointer-events:none}
#hud{position:absolute;left:10px;top:10px;overflow-wrap:anywhere;max-width:min(400px,calc(100% - 20px));background:rgba(6,8,14,.72);border:1px solid var(--line);border-radius:8px;padding:8px 10px;pointer-events:none;backdrop-filter:blur(3px)}
#hud .t{font:600 13px var(--mono)}
#hud .k{color:var(--mut)}
#hud .row{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px}
#hud b{font-weight:500;font-family:var(--mono)}
#hud .warn{color:var(--warn)}
#hud .ok{color:var(--ok)}
#hud b.inf,aside .inf{color:var(--inf)}#hud b.inf::after,aside .inf::after{content:"†";font-size:10px;vertical-align:super;margin-left:1px}
#hud .legend{margin-top:4px;font-size:10.5px;color:var(--mut)}#hud .legend i{color:var(--inf);font-style:normal}
#hud b[title]{cursor:help;border-bottom:1px dotted rgba(228,232,242,.35)}
#zoomp{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
#zoomp button{text-align:left}
#stat{position:absolute;right:10px;bottom:10px;font-size:11px;color:var(--txt);background:rgba(6,8,14,.72);padding:3px 7px;border-radius:6px;pointer-events:none}#stat:empty{display:none}
button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #ffd24a;outline-offset:2px}
#tag{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--mut);background:rgba(6,8,14,.6);padding:3px 7px;border-radius:6px;pointer-events:none}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 12px;font-size:12px;min-height:0}
aside h2{font-size:12.5px;margin:10px 0 4px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
aside h2:first-child{margin-top:0}
aside table{width:100%;border-collapse:collapse;font-size:11.5px}
aside td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:top}
aside td:first-child{color:var(--txt);min-width:96px}
aside .src{color:var(--mut);font-family:var(--mono);font-size:10.5px;overflow-wrap:anywhere}
.flag{display:inline-block;border-radius:4px;padding:0 5px;font-size:10px;font-weight:600;letter-spacing:.3px;margin-left:4px;vertical-align:middle}
.flag.d{background:#17382a;color:var(--ok)}
.flag.i{background:#3a2a17;color:var(--acc)}
.flag.n{background:#3a1f1a;color:var(--warn)}
blockquote{margin:6px 0;padding:4px 9px;border-left:3px solid var(--line);font-size:11.5px}
blockquote cite{display:block;color:var(--mut);font-style:normal;font-size:10.5px;font-family:var(--mono);margin-top:2px;overflow-wrap:anywhere}
footer{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);background:var(--panel)}
footer input[type=range]{width:100%;accent-color:var(--acc);margin:0}
#tlwrap{flex:1;min-width:80px;position:relative;display:flex;flex-direction:column;gap:1px}#ticks{width:100%;height:14px;display:block}
#clock{font:12px var(--mono);color:var(--txt);white-space:nowrap;min-width:150px;text-align:right}
#gate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);text-align:center;padding:20px;color:var(--mut)}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
  header{padding:5px 8px;gap:4px 6px}header h1{display:none}#scene{max-width:58vw}#follow{max-width:38vw}label.k{display:inline-flex;align-items:center;gap:4px;max-width:100%}
  #hud{font-size:11.5px;max-width:calc(100% - 20px);max-height:44%;overflow:auto;pointer-events:auto}#hud .t{font-size:12px}
  aside{display:none}aside.open{display:block}
  header{grid-column:1}
  aside{grid-column:1;border-left:0;border-top:1px solid var(--line);max-height:34vh}
  footer{grid-column:1;flex-wrap:wrap}#tlwrap{order:3;flex-basis:100%}#clock{flex:1;min-width:0}
  #hud{max-height:32%!important}
  #perf{display:none}
  header h1 span{display:none}
  #hud{max-width:calc(100% - 20px);font-size:12px}
  #zoomp{top:auto;bottom:10px}
  #tag{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Galileo moons and craft <span>· prototype · data-only mapping</span></h1>
    <label class="k">scene <select id="scene"></select></label>
    <label class="k">follow <select id="follow"></select></label>
    <label class="k">tier <button class="sm" id="tierAuto" aria-pressed="true" title="auto: HIGH on a hardware renderer, LOW on a software renderer or a slow frame probe; in auto the HIGH tier lowers its render scale, then drops to LOW, if drawn frames stay slower than 45 ms">auto</button><button class="sm" id="tierLow" aria-pressed="false" title="256×128 nearest textures, voxel craft, no tone mapping">LOW</button><button class="sm" id="tierMed" aria-pressed="false" title="1024×512 textures built in the background, no normal maps, mesh craft with half the segments, pixel ratio up to 1.5">MED</button><button class="sm" id="tierHigh" aria-pressed="false" title="2048×1024 textures built in the background when a body is large on screen, mesh craft, normal maps">HIGH</button></label>
    <button class="sm" id="glowTog" aria-pressed="false" title="Illustrative glow around the Sun disc; off = true angular size only">Sun glow (not to scale)</button>
    <button class="sm" id="starTog" aria-pressed="true" title="Illustrative star background">stars</button>
    <button class="sm" id="atmTog" aria-pressed="true" title="Below-the-cloud-top atmosphere rendering: illustrative; haze density follows NEP XSEC22 and light level follows NFR TCNF where those files have valid rows">atmosphere</button>
    <button class="sm" id="sideTog" aria-pressed="true">sources</button>
    <span id="perf">tier <b id="tierName">–</b> · <b id="ms">–</b> ms/frame · <b id="calls">–</b> draws · <b id="tris">–</b> tris · <b id="rend">–</b></span>
  </header>
  <div id="stage">
    <canvas id="gl" tabindex="0" aria-label="3D view. Drag to rotate, scroll or pinch to zoom. Space starts and stops time; left and right arrows step time."></canvas><canvas id="lead"></canvas>
    <div id="hud"></div>
    <div id="zoomp"><button class="sm" data-z="craft">zoom: craft</button><button class="sm" data-z="local">zoom: local</button><button class="sm" data-z="system">zoom: system</button></div>
    <div id="tag">surface textures, craft geometry and star field are illustrative; positions, radii, light direction and times are from the PDS files listed under “sources”</div>
    <div id="stat" role="status" aria-live="polite"></div>
    <div id="gate">WebGL is not available in this browser.</div>
  </div>
  <aside id="side"></aside>
  <footer>
    <button id="play" class="sm" aria-label="Play or pause time" title="Play or pause (Space)">▶</button>
    <select id="speed" aria-label="Playback speed"></select>
    <div id="tlwrap"><canvas id="ticks"></canvas><input type="range" id="scrub" min="0" max="10000" value="0" aria-label="Time within the scene window"></div>
    <span id="clock">—</span>
  </footer>
</div>
<script type="application/json" id="pack">__PACK__</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const P=JSON.parse($('#pack').textContent);
const RJ=P.meta.RJ_km, RAD=Math.PI/180, TAU=Math.PI*2;
const MOONS={}; P.moons.forEach(m=>MOONS[m.key]=m);
const BOD=P.bodies.bodies, RT=k=>BOD[k].radius_km;   /* single source of truth: data/bodies.json. Label radii (fl.rk_km) only convert the trajectory files to km */
const MK4=['IO','EUROPA','GANYMEDE','CALLISTO'];
const JUP_REQ=P.probe.orbtrtrj.jup_req_km, JUP_RPOL=P.probe.orbtrtrj.jup_rpol_km;     /* ORBTRTRJ.TAB bodies table */
const SUN_REQ=P.probe.orbtrtrj.sun_req_km, SUN_DIST=P.probe.orbtrtrj.sun_dist_km[0];   /* ORBTRTRJ.TAB bodies table / first row */
const AU=149597870.7;                                                                /* IAU 2012 Resolution B2 (definition) */
const SUN_ANG=2*Math.asin(SUN_REQ/SUN_DIST), SUN_REL=(AU/SUN_DIST)**2;
const EXPOSURE_GAIN=1/SUN_REL;                 /* tone-mapping gain so that an albedo-1 surface renders near 1.0; stated in the sources panel */
const fmtUTC=ms=>new Date(ms).toISOString().replace('T',' ').slice(0,19);
const f=(x,d=1)=>Number(x).toFixed(d);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function bis(a,t){let lo=0,hi=a.length-1;if(t<=a[0])return 0;if(t>=a[hi])return Math.max(0,hi-1);while(hi-lo>1){const m=(lo+hi)>>1;if(a[m]<=t)lo=m;else hi=m}return lo}
function lerp(ts,v,t){if(ts.length<2)return v[0];const i=bis(ts,t),fr=clamp((t-ts[i])/(ts[i+1]-ts[i]||1),0,1);return v[i]+(v[i+1]-v[i])*fr}
function lerpA(ts,v,t){if(ts.length<2)return v[0];const i=bis(ts,t),fr=clamp((t-ts[i])/(ts[i+1]-ts[i]||1),0,1);let d=v[i+1]-v[i];d-=360*Math.round(d/360);return v[i]+d*fr}
function lerp3(ts,v,t,out){if(ts.length<2){out.set(v[0][0],v[0][1],v[0][2]);return out}const i=bis(ts,t),fr=clamp((t-ts[i])/(ts[i+1]-ts[i]||1),0,1),a=v[i],b=v[i+1];return out.set(a[0]+(b[0]-a[0])*fr,a[1]+(b[1]-a[1])*fr,a[2]+(b[2]-a[2])*fr)}
const sph=(R,lat,az,out)=>{const la=lat*RAD,a=az*RAD;return out.set(R*Math.cos(la)*Math.cos(a),R*Math.cos(la)*Math.sin(a),R*Math.sin(la))};

/* ---------------- renderer + tier ---------------- */
const cv=$('#gl'); let R_;
let GLINFO='unknown';
try{const g=cv.getContext('webgl2')||cv.getContext('webgl');const ext=g&&g.getExtension('WEBGL_debug_renderer_info');if(ext)GLINFO=g.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'unknown';}catch(e){}
const SOFT=/swiftshader|llvmpipe|software|mesa offscreen|microsoft basic/i.test(GLINFO);
let TIER_PREF='auto', TIER=SOFT?'LOW':'HIGH';
const autoTier=()=>(SOFT||PROBE_MS>40)?'LOW':PROBE_MS>12?'MEDIUM':'HIGH';   /* frame probe: 10 frames of a 16k-triangle sphere */
try{R_=new THREE.WebGLRenderer({canvas:cv,antialias:!SOFT,alpha:false,logarithmicDepthBuffer:true,powerPreference:'high-performance'});}catch(e){$('#gate').style.display='flex';}
if(!R_)return;
$('#rend').textContent=GLINFO.slice(0,38);
R_.setClearColor(0x06080e,1);R_.outputEncoding=THREE.sRGBEncoding;
let DPRS=1,HI_W=2048,SMK=1;   /* HI_W: built texture width (HIGH 2048, MEDIUM 1024); SMK: craft mesh segment factor (MEDIUM 0.5) */
//   /* render-scale factor used by the adaptive governor (HIGH, auto) */
function applyTier(){
  R_.setPixelRatio(TIER==='HIGH'?Math.min(devicePixelRatio||1,2)*DPRS:TIER==='MEDIUM'?Math.min(devicePixelRatio||1,1.5):1);HI_W=TIER==='MEDIUM'?1024:2048;SMK=TIER==='MEDIUM'?.5:1;
  R_.toneMapping=TIER!=='LOW'?THREE.ACESFilmicToneMapping:THREE.NoToneMapping;
  R_.toneMappingExposure=TIER!=='LOW'?1.0:1.0;
  $('#tierName').textContent=TIER+(TIER_PREF==='auto'?' (auto)':'');
  $('#tierAuto').setAttribute('aria-pressed',TIER_PREF==='auto');$('#tierLow').setAttribute('aria-pressed',TIER_PREF==='LOW');$('#tierHigh').setAttribute('aria-pressed',TIER_PREF==='HIGH');$('#tierMed').setAttribute('aria-pressed',TIER_PREF==='MEDIUM');
}
/* frame-time probe: 10 frames of a 16k-triangle sphere; if slow, drop to LOW */
function probeFrameTime(){const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.z=3;const m=new THREE.Mesh(new THREE.SphereGeometry(1,128,64),new THREE.MeshStandardMaterial({color:0x888888}));sc.add(m);sc.add(new THREE.DirectionalLight(0xffffff,1));
  R_.setSize(256,256,false);const t0=performance.now();for(let i=0;i<10;i++){m.rotation.y+=.1;R_.render(sc,cam)}R_.getContext().finish&&R_.getContext().finish();const dt=(performance.now()-t0)/10;m.geometry.dispose();m.material.dispose();return dt}
const PROBE_MS=probeFrameTime();
if(TIER_PREF==='auto')TIER=autoTier();
applyTier();

/* ---------------- procedural textures (illustrative) ---------------- */
function hash(x,y,s){let h=(x*374761393+y*668265263+s*1442695041)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,oct){let v=0,amp=.5,fr=1;for(let i=0;i<oct;i++){v+=amp*vnoise(x*fr,y*fr,s+i*17);amp*=.5;fr*=2}return v}
/* spherical wrap: sample noise on the unit sphere so the texture has no seam */
function sfbm(lon,lat,s,oct,sc){const cl=Math.cos(lat);const x=cl*Math.cos(lon),y=cl*Math.sin(lon),z=Math.sin(lat);let v=0,amp=.5,fr=sc;for(let i=0;i<oct;i++){v+=amp*(vnoise(x*fr+7,y*fr+3,s+i*31)*.5+vnoise(y*fr+1,z*fr+5,s+i*31+7)*.5);amp*=.5;fr*=2}return v}
const q=(v,n)=>Math.round(v*n)/n;   /* colour quantisation for the voxel look */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
/* height -> normal map (tangent space), nearest filtered */
function normalData(hgt,w,h,strength){const d=new Uint8ClampedArray(w*h*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const l=hgt[y*w+(x+w-1)%w],r=hgt[y*w+(x+1)%w],u=hgt[Math.max(0,y-1)*w+x],dn=hgt[Math.min(h-1,y+1)*w+x];
    let nx=-(r-l)*strength,ny=(dn-u)*strength,nz=1;const L=Math.hypot(nx,ny,nz);nx/=L;ny/=L;nz/=L;const o=4*(y*w+x);d[o]=128+127*nx;d[o+1]=128+127*ny;d[o+2]=128+127*nz;d[o+3]=255}
  return d}
function normalFromHeight(hgt,w,h,strength){const c=mkCanvas(w,h);c.getContext('2d').putImageData(new ImageData(normalData(hgt,w,h,strength),w,h),0,0);return c}
const CRC={};
function craters(seed,n,rmin,rmax){const k=seed+'/'+n;if(CRC[k])return CRC[k];const c=new Float32Array(n*4);for(let i=0;i<n;i++){const a=hash(i,1,seed)*TAU,b=Math.asin(2*hash(i,2,seed)-1),r=rmin+(rmax-rmin)*hash(i,3,seed)**2,cb=Math.cos(b);c[4*i]=cb*Math.cos(a);c[4*i+1]=cb*Math.sin(a);c[4*i+2]=Math.sin(b);c[4*i+3]=r}return CRC[k]=c}
function craterField(lon,lat,seed,n,rmin,rmax){ /* returns [depth(-1..1 rim/bowl), coverage] from n pseudo-random craters on the sphere */
  let dep=0,hit=0;const cl=Math.cos(lat),px=cl*Math.cos(lon),py=cl*Math.sin(lon),pz=Math.sin(lat),C=craters(seed,n,rmin,rmax);
  for(let i=0;i<n;i++){const r=C[4*i+3];if(Math.abs(pz-C[4*i+2])>r)continue;const d=Math.acos(clamp(px*C[4*i]+py*C[4*i+1]+pz*C[4*i+2],-1,1));if(d<r){const t=d/r;dep+= t<.75?-(1-t/.75)*.8:(1-(t-.75)/.25)*.6;hit=1}}
  return [dep,hit]}
/* JUPITER colour. Band edges at published zenographic (planetographic) latitudes; colours chosen here to match published colour words (see Sources panel); features painted procedurally at
   documented or extrapolated positions; no imagery. extra = additional fine octaves for the local caps. JF = per-scene feature set (jupFeatures). */
/* [south edge (deg, planetographic), R, G, B (sRGB 0-255), name] ascending; edges: JBAA 113(1) Table 3 (1999/2000) unless marked in the Sources panel */
const JB=[[-90,122,123,130,'S. polar hood'],[-66.8,150,146,142,'SPR'],[-53.2,196,188,176,'S3TZ'],[-48.0,152,140,130,'S3TB'],[-42.6,204,196,182,'SSTZ'],[-38.5,150,136,124,'SSTB'],[-35.5,216,207,190,'STZ'],
  [-32.3,160,148,136,'STB'],[-29.3,128,116,106,'STB(N)'],[-27.4,240,234,220,'STropZ'],[-21.4,128,88,64,'SEB(S)'],[-16.9,196,166,128,'SEBZ'],[-10.0,152,112,84,'SEB(N)'],[-8.0,238,232,216,'EZ(S)'],
  [-4.1,206,204,200,'EB'],[1.0,232,218,188,'EZ(N)'],[8.8,150,88,58,'NEB'],[16.9,238,232,218,'NTropZ'],[25.0,124,102,90,'NTB'],[28.1,222,214,198,'NTZ'],[36.9,160,148,138,'NNTB'],[40.0,204,198,188,'NNTZ'],
  [45.0,166,156,148,'N3TB'],[47.0,188,183,178,'N3TZ'],[54.1,150,146,144,'N4TB'],[56.1,152,148,146,'NPR'],[63.0,172,168,164,'Bland Zone'],[68.4,122,124,132,'N. polar hood']];
const wrapd=d=>{d=(d+180)%360;if(d<0)d+=360;return d-180};
function jupBand(pg,w,o){let i=0;const n=JB.length;while(i<n-1&&JB[i+1][0]<=pg)i++;const B=JB[i];let r=B[1],g=B[2],b=B[3];
  if(w>0){if(i>0){const d=pg-B[0];if(d<w){const A=JB[i-1],k=.5-.5*d/w;r+=(A[1]-r)*k;g+=(A[2]-g)*k;b+=(A[3]-b)*k}}if(i<n-1){const d=JB[i+1][0]-pg;if(d<w){const A=JB[i+1],k=.5-.5*d/w;r+=(A[1]-r)*k;g+=(A[2]-g)*k;b+=(A[3]-b)*k}}}
  o[0]=r/255;o[1]=g/255;o[2]=b/255}
const JO=[0,0,0];
function jupColor(lon,lat,sd,extra,hi){const F=JF,det=hi||extra;
  const pg0=Math.atan(F.ratio*Math.tan(lat))/RAD;                         /* mesh row angle (parametric latitude of the oblate sphere) -> planetographic latitude */
  const L3=((Math.PI-lon)/RAD%360+360)%360;                               /* System III west longitude of this texel (texture longitude = pi - W longitude, as in mkCap) */
  const tur=sfbm(lon*2,lat,sd+4,3,8);
  /* zonally stretched noise, phase-shifted with latitude so that shapes slant across the bands (illustrative stand-in for shear between jets) */
  const sh=lon+.5*Math.sin(pg0*.31)+.25*Math.sin(pg0*.83+1),st=sfbm(sh,lat*7,sd+60,det?5:3,6)-.5,st2=det?sfbm(sh*1,lat*23,sd+64,4,20)-.5:0;
  let fine=sfbm(lon*3,lat*3,sd+8,3,40)-.5;if(hi)fine+=.5*(sfbm(lon*4,lat*14,sd+66,4,50)-.5);

  $('#side').innerHTML=`<h2>What is drawn, and from where</h2><table>${rows}</table>${r2}<h2>PDS document statements (verbatim)</h2>${Q.map(q=>`<blockquote>“${q[0]}”<cite>${q[1]}</cite></blockquote>`).join('')}<h2>Tier</h2><div class="src">renderer: ${GLINFO}<br>software-renderer match: ${SOFT}; probe ${PROBE_MS.toFixed(1)} ms/frame (10 frames, 16k-tri sphere) → ${TIER}${TIER_PREF==='auto'?' (auto)':' (forced)'}<br>LOW: Lambert materials, 256×128 nearest-filtered body textures (cap 512²), 40-segment moons, 56-segment Jupiter, voxel craft, 900 stars, dpr 1, no tone mapping.<br>MEDIUM: Standard materials without normal maps; 1024×512 body textures built in the background (512×256 until ready), caps 1024²; 96-segment moons, 128-segment Jupiter; mesh craft with half the segments; 4000 stars; ACES tone mapping; dpr ≤ 1.5. GPU memory per 1024×512 body texture with mipmaps: ${(1024*512*4*4/3/1e6).toFixed(1)} MB †.<br>HIGH: Standard materials with normal maps; 2048×1024 body textures and 2048² caps built in ${HIQ.workers.length||'no'} Web Worker(s)${HIQ.ok?'':' (Workers unavailable: built on the main thread)'}, with 512×256 / 1024² shown until each is ready; a body’s 2048-px texture is built only once it spans more than 120 px on screen, and the build canvases are freed after the GPU upload (a revisit rebuilds); moons under 60 px use a 960-triangle sphere; frames are drawn only when something changes; linear filtering, mipmaps, anisotropy ≤ 8; 192-segment moons, 256-segment Jupiter, mesh craft, 9000 stars, ACES tone mapping, dpr ≤ 2. GPU memory per 2048×1024 body, colour + normal with mipmaps: ${(2048*1024*4*4/3*2/1e6).toFixed(1)} MB †; per 2048² cap: ${(2048*2048*4*4/3*2/1e6).toFixed(1)} MB †. Auto: frame probe ≤ 12 ms → HIGH, ≤ 40 ms → MEDIUM, otherwise or on a software renderer → LOW; in auto, HIGH lowers its render scale and then steps to MEDIUM, and MEDIUM steps to LOW, when drawn frames stay slower than 45 ms for 3 s.</div>`}

/* ---------------- loop ---------------- */
function resize(){const st=$('#stage'),w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;R_.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();NEED=3}
new ResizeObserver(resize).observe($('#stage'));
let last=performance.now(),ema=16,acc=0,nfr=0,lastHud=0,emaI=16,NEED=3,LASTKEY='',BENCH=false,DRAWN=0,slow=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);emaI=emaI*.9+Math.min(1000,now-last)*.1;last=now;
  if(S.play){S.T+=S.speed*dt;if(S.T>SCN.t1){S.T=SCN.t1;S.play=false;$('#play').textContent='▶'}}
  /* render on demand: a frame is drawn only when time, camera, view size, a toggle, the scene or a texture changed (NEED), or while playing; idle frames cost one controls update */
  const moved=ctl.update(),key=S.T+'|'+S.follow+'|'+S.glow+S.stars+S.atm+'|'+cv.width+'x'+cv.height;if(key!==LASTKEY){LASTKEY=key;NEED=Math.max(NEED,2)}
  if(S.play||moved||NEED>0||BENCH){if(NEED>0)NEED--;const t0=performance.now();
    setLimits();updateWorld(S.T);ctl.update();R_.render(scene,cam);drawLabels();
    const ft=performance.now()-t0;ema=ema*.9+ft*.1;acc+=ft;nfr++;DRAWN++}
  if(now-lastHud>250){lastHud=now;hud();$('#ms').textContent=emaI.toFixed(1)+' ('+ema.toFixed(1)+' js)';$('#calls').textContent=R_.info.render.calls;$('#tris').textContent=R_.info.render.triangles.toLocaleString('en-US');$('#stat').textContent=(TIER!=='LOW'&&HIQ.jobs.length?'building '+HI_W+'-px textures: '+HIQ.jobs.length+' left':'')+(DPRS<1?(HIQ.jobs.length?' · ':'')+'render scale '+DPRS:'');
    /* adaptive resolution (HIGH, auto only): after 3 s of drawn frames slower than 45 ms the pixel ratio is scaled to 0.75, then 0.5, then the tier drops to LOW */
    if(TIER==='HIGH'&&TIER_PREF==='auto'&&(S.play||NEED>0)){slow=emaI>45?slow+1:0;if(slow>=12){slow=0;if(DPRS>.5){DPRS-=.25;applyTier();resize();NEED=3}else{DPRS=1;TIER='MEDIUM';applyTier();rebuildSky();loadScene(S.scene)}}}
    else if(TIER==='MEDIUM'&&TIER_PREF==='auto'&&(S.play||NEED>0)){slow=emaI>45?slow+1:0;if(slow>=12){slow=0;TIER='LOW';applyTier();rebuildSky();loadScene(S.scene)}}else slow=0}
  requestAnimationFrame(frame)}

/* ---------------- UI ---------------- */
sceneSel.addEventListener('change',e=>loadScene(e.target.value));
$('#follow').addEventListener('change',e=>{S.follow=e.target.value;applyUp();zoomTo('local')});
$$('#zoomp button').forEach(b=>b.addEventListener('click',()=>zoomTo(b.dataset.z)));
$('#play').addEventListener('click',()=>{S.play=!S.play;$('#play').textContent=S.play?'❚❚':'▶'});
$('#speed').addEventListener('change',e=>S.speed=+e.target.value);
$('#scrub').addEventListener('input',e=>{S.T=SCN.t0+(+e.target.value/10000)*(SCN.t1-SCN.t0)});
$('#glowTog').addEventListener('click',e=>{S.glow=!S.glow;e.target.setAttribute('aria-pressed',S.glow)});
$('#starTog').addEventListener('click',e=>{S.stars=!S.stars;e.target.setAttribute('aria-pressed',S.stars)});
$('#atmTog').addEventListener('click',e=>{S.atm=!S.atm;e.target.setAttribute('aria-pressed',S.atm)});
const mobileQ=matchMedia('(max-width:760px)');
$('#sideTog').addEventListener('click',e=>{const a=$('#side');if(mobileQ.matches){a.classList.toggle('open');e.target.setAttribute('aria-pressed',a.classList.contains('open'))}else{a.hidden=!a.hidden;e.target.setAttribute('aria-pressed',!a.hidden);document.getElementById('app').style.gridTemplateColumns=a.hidden?'1fr 0px':''}resize()});
if(mobileQ.matches)$('#sideTog').setAttribute('aria-pressed','false');
function forceTier(t){NEED=4;DPRS=1;TIER_PREF=t;const nt=t==='auto'?autoTier():t;if(nt!==TIER){TIER=nt;applyTier();rebuildSky();fill.intensity=TIER!=='LOW'?.25:.4;loadScene(S.scene)}else applyTier();setHash()}
$('#tierAuto').addEventListener('click',()=>forceTier('auto'));$('#tierLow').addEventListener('click',()=>forceTier('LOW'));$('#tierHigh').addEventListener('click',()=>forceTier('HIGH'));$('#tierMed').addEventListener('click',()=>forceTier('MEDIUM'));
window.addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='BUTTON')return;if(e.code==='Space'){e.preventDefault();$('#play').click()}else if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();const st=(e.shiftKey?60:10)*(e.code==='ArrowLeft'?-1:1);S.T=clamp(S.T+st,SCN.t0,SCN.t1)}});
function setHash(){try{history.replaceState(null,'','#'+encodeURIComponent(S.scene)+'&tier='+TIER_PREF)}catch(_){}}
(function init(){const h=decodeURIComponent(location.hash.slice(1)).split('&');let sc=h[0]&&SCENES.some(s=>s.id===h[0])?h[0]:'FLY:E4';const tp=h.find(x=>x.startsWith('tier='));if(tp){const t=tp.slice(5);if(t==='LOW'||t==='HIGH'||t==='MEDIUM'){TIER_PREF=t;TIER=t;applyTier();rebuildSky()}}
  resize();sceneSel.value=sc;loadScene(sc);S.T=SCN.kind==='PROBE'?-600:-600;requestAnimationFrame(frame)})();
window.__moons={set bench(v){BENCH=!!v},get drawn(){return DRAWN},get need(){return NEED},get dprs(){return DPRS},get JF(){return JF},JB,texture,capTexture,nearTexture,texData,get hiq(){return {left:HIQ.jobs.length,done:HIQ.done,ok:HIQ.ok,workers:HIQ.workers.length}},craftStats:()=>{const o={};for(const k in crafts)for(const p in crafts[k].sub){const g=crafts[k].sub[p].geometry;o[k+'.'+p]=g.userData.lines?g.attributes.position.count/2+' line segments':g.attributes.position.count/3}return o},bodyStats:()=>{const o={};for(const k in bodies){const m=bodies[k].mesh,im=m.material.map.image;o[k]={tris:m.geometry.index?m.geometry.index.count/3:m.geometry.attributes.position.count/3,map:im.width+'x'+im.height};for(const c of ['cap','near'])if(bodies[k][c]){const q=bodies[k][c];o[k+'.'+c]={tris:q.geometry.index.count/3,map:q.material.map.image.width+'x'+q.material.map.image.height}}}return o},get S(){return S},get SCN(){return SCN},WORLD,cam,ctl,loadScene,zoomTo,setT:t=>{S.T=t},setFollow:k=>{S.follow=k;$('#follow').value=k;applyUp()},forceTier,get tier(){return TIER},get ema(){return ema},get frameMs(){return emaI},get glinfo(){return GLINFO},renderer:R_,scene,get bodies(){return bodies},get crafts(){return crafts},get probeMs(){return PROBE_MS},descentRate,windAt,pressureAt,hazeAt,lightAt,finiteDiffAlt,get fogState(){return SCN&&SCN.kind==='PROBE'?{on:!!SCN.fogOn,density:SCN.dens,L:SCN.Lv,ceilAlt:SCN.ceilAlt,fogW:SCN.fogW,camAlt:SCN.camAlt,appliedDensity:SCN.fog.density}:null}};
})();
